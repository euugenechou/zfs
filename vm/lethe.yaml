# Lima VM for Lethe (ZFS + KHF secure delete) development.
# Modeled on ~/Code/ldd/lima/ldd.yaml.
#
# Start:  limactl start --name=lethe vm/lethe.yaml --tty=false
# Shell:  limactl shell lethe
#
# Workflow: edit on macOS (repo is mounted read-write at the same path);
# in the VM, vm/sync-build.sh rsyncs the tree to ~/lethe-build (VM-local
# disk) and builds there. A ZFS deadlock just hangs threads — the VM
# stays reachable and khungtaskd prints blocked-task stacks to dmesg.
minimumLimaVersion: "1.0.0"
vmType: vz

# No containers needed; the rootless-containerd setup has hung provisioning.
containerd:
  system: false
  user: false

cpus: 8
memory: "12GiB"
disk: "100GiB"

images:
- location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

mounts:
- location: "~/Research/code/lethe"
  writable: true

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    # ZFS build deps (repo install.sh) + debug/bench tooling.
    apt-get install -y --no-install-recommends \
      alien autoconf automake build-essential debhelper-compat dh-autoreconf \
      dh-dkms dh-python dkms fakeroot gawk git libaio-dev libattr1-dev \
      libblkid-dev libcurl4-openssl-dev libelf-dev libffi-dev libpam0g-dev \
      libssl-dev libtirpc-dev libtool libudev-dev libunwind-dev \
      linux-headers-generic po-debconf python3 python3-all-dev python3-cffi \
      python3-dev python3-packaging python3-setuptools uuid-dev zlib1g-dev \
      rsync kmod file bc trace-cmd fio openjdk-21-jre-headless maven curl
    # Surface hung tasks quickly while debugging the deadlock.
    cat > /etc/sysctl.d/99-lethe-debug.conf <<'EOF'
    kernel.hung_task_timeout_secs = 60
    kernel.hung_task_all_cpu_backtrace = 1
    # Answer SysRq requests (limactl shell -> echo w > /proc/sysrq-trigger).
    kernel.sysrq = 1
    EOF
    sysctl --system || true
- mode: user
  script: |
    #!/bin/bash
    set -eux
    ln -sfn /Users/eugebe/Research/code/lethe "$HOME/lethe"
